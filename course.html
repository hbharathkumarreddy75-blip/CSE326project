<!DOCTYPE html>
<html>
<head>
    <title>Course Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Course Feedback Form</h1>
    <input type="text" placeholder="Student Name">

<input type="number" placeholder="Registration Number">

<select>
    <option>Select Semester</option>
    <option>1st Semester</option>
    <option>2nd Semester</option>
    <option>3rd Semester</option>
    <option>4th Semester</option>
    <option>5th Semester</option>
    <option>6th Semester</option>
    <option>7th Semester</option>
    <option>8th Semester</option>
</select>
    <label>Select Course</label>

<select>
    <option>Choose Your Course</option>

    <option>B.Tech Computer Science Engineering (CSE)</option>
    <option>B.Tech Information Technology (IT)</option>
    <option>B.Tech Mechanical Engineering</option>
    <option>B.Tech Civil Engineering</option>
    <option>B.Tech Electronics & Communication Engineering (ECE)</option>

    <option>BCA</option>
    <option>MCA</option>

    <option>B.Com</option>
    <option>M.Com</option>

    <option>BBA</option>
    <option>MBA</option>

    <option>BA</option>
    <option>MA</option>

    <option>B.Sc Agriculture</option>
    <option>B.Sc Physics</option>
    <option>B.Sc Chemistry</option>

    <option>LLB</option>
    <option>BA LLB</option>

    <option>B.Arch</option>

    <option>B.Pharmacy</option>
    <option>M.Pharmacy</option>
</select>
     <input type="text" placeholder="Faculty Name">

    <select>
        <option>Teaching Quality</option>
        <option>1 - Poor</option>
        <option>2 - Fair</option>
        <option>3 - Good</option>
        <option>4 - Very Good</option>
        <option>5 - Excellent</option>
    </select>

    <select>
        <option>Course Content</option>
        <option>1 - Poor</option>
        <option>2 - Fair</option>
        <option>3 - Good</option>
        <option>4 - Very Good</option>
        <option>5 - Excellent</option>
    </select>

    <select>
        <option>Overall Satisfaction</option>
        <option>1 - Poor</option>
        <option>2 - Fair</option>
        <option>3 - Good</option>
        <option>4 - Very Good</option>
        <option>5 - Excellent</option>
    </select>
    <textarea placeholder="Enter Other Feedback"></textarea>
    <a href="thankyou.html">
    <button type="button">Submit Feedback</button>
    </a>
</div>

</body>
</html>
